{% extends "base.html" %}
{% block title %}Mon profil — StageSearch{% endblock %}

{% block content %}
  <div class="max-w-2xl mx-auto bg-white rounded-2xl border border-slate-200 shadow-sm p-8">
    <div class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-2xl font-bold text-slate-900">Mon profil</h1>
        <p class="text-sm text-slate-500">Rôle : <span class="font-semibold text-blue-700">{{ user.get_role_display }}</span></p>
      </div>
    </div>

    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div class="grid sm:grid-cols-2 gap-4">
        {% for field in form %}
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}<p class="text-xs text-red-600 mt-1">{{ field.errors.0 }}</p>{% endif %}
          </div>
        {% endfor %}
      </div>
      <div class="pt-2">
        <button type="submit" class="px-5 py-2.5 rounded-lg bg-blue-600 text-white font-semibold text-sm hover:bg-blue-700 shadow-sm transition">
          Enregistrer les modifications
        </button>
      </div>
    </form>
  </div>
{% endblock %}
